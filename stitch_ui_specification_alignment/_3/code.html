<script>
    document.addEventListener('DOMContentLoaded', () => {
        const aiBtn = document.getElementById('ai-assistant-btn');
        const closeAiBtn = document.getElementById('close-ai-btn');
        const aiSidebar = document.getElementById('ai-sidebar');
        const aiBackdrop = document.getElementById('ai-backdrop');

        function toggleSidebar() {
            const isClosed = aiSidebar.classList.contains('translate-x-full');
            if (isClosed) {
                aiSidebar.classList.remove('translate-x-full');
                aiBackdrop.classList.remove('opacity-0', 'pointer-events-none');
            } else {
                aiSidebar.classList.add('translate-x-full');
                aiBackdrop.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        aiBtn.addEventListener('click', toggleSidebar);
        closeAiBtn.addEventListener('click', toggleSidebar);
        aiBackdrop.addEventListener('click', toggleSidebar);
    });
</script>
